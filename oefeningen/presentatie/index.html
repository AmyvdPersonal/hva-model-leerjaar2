# Onderwerp

Mijn onderwerp gaat over Star Wars. 
Star Wars is meer dan film. Het is een episch universum vol verhalen over hoop, de strijd tussen goed en kwaad, en de creativiteit van een sterrenstelsel ver, ver weg.

Wat Star wars voor mij leuk maakt is dat je in de prequals ziet hoe de slechterik vanm een goed persoon naar een slecht persoon is gegaan. De character development is heel goed ontwikkled in star wars.
Ze zijn niet bang om iemand een tragisch verleden te geven. Daarnaast zijn de lightsaber gevechten best wel gaaf om te zien.

# Wat en Hoe ga ik dit vertellen

<p>In deze digital garden verken je de strijd tussen de Light Side en de Dark Side. Via strakke, donkere datakaarten met rood-blauwe contrasten dwaal je door de galaxy. Je leert precies hoe de Force werkt, ontdekt de achtergrond van iconische karakters en snapt de techniek achter lichtzwaarden. Het is een groeiende, levende plek waar je zelf je pad kiest en de systemen van het Star Wars-universum leert begrijpen.</p>
